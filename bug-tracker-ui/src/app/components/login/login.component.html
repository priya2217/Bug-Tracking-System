<div
  class="min-h-screen bg-gradient-to-br from-indigo-600 via-purple-600 to-pink-500 flex items-center justify-center relative overflow-hidden"
>
  <!-- Animated background blobs -->
  <div
    class="absolute top-0 -left-4 w-96 h-96 bg-purple-300 rounded-full mix-blend-multiply filter blur-3xl opacity-20 animate-blob"
  ></div>
  <div
    class="absolute top-0 -right-4 w-96 h-96 bg-pink-300 rounded-full mix-blend-multiply filter blur-3xl opacity-20 animate-blob animation-delay-2000"
  ></div>
  <div
    class="absolute -bottom-8 left-20 w-96 h-96 bg-indigo-300 rounded-full mix-blend-multiply filter blur-3xl opacity-20 animate-blob animation-delay-4000"
  ></div>

  <!-- Login Card -->
  <div class="relative z-10 w-full max-w-md mx-4">
    <div
      class="bg-white bg-opacity-95 backdrop-blur-xl rounded-2xl shadow-2xl p-8 md:p-10"
    >
      <!-- Header -->
      <div class="text-center mb-8">
       
        <h1 class="text-4xl font-bold text-gray-800 mb-2">Welcome Back</h1>
        <p class="text-gray-500 text-sm">
          Enter your credentials to access your account
        </p>
      </div>

      <!-- Form -->
      <form (ngSubmit)="onSubmit()" class="space-y-5">
        <!-- Username Field -->
        <div class="group">
          <label class="block text-sm font-semibold text-gray-700 mb-2"
            >Username</label
          >
          <div class="relative">
            <input
              type="text"
              placeholder="Enter your username"
              [(ngModel)]="loginData.usernameOrEmail"
              name="usernameOrEmail"
              required
              class="w-full px-4 py-3 bg-gray-50 border-2 border-gray-200 rounded-lg focus:outline-none focus:border-indigo-500 focus:bg-white transition-all duration-200 text-gray-800 placeholder-gray-400"
            />
            
          </div>
        </div>

        <!-- Password Field -->
        <div class="group">
          <label class="block text-sm font-semibold text-gray-700 mb-2"
            >Password</label
          >
          <div class="relative">
            <input
              type="password"
              placeholder="Enter your password"
              [(ngModel)]="loginData.password"
              name="password"
              required
              class="w-full px-4 py-3 bg-gray-50 border-2 border-gray-200 rounded-lg focus:outline-none focus:border-indigo-500 focus:bg-white transition-all duration-200 text-gray-800 placeholder-gray-400"
            />
            
          </div>
        </div>

        <!-- Error Message -->
        <div
          *ngIf="errorMessage"
          class="bg-red-50 border-l-4 border-red-500 p-4 rounded-lg"
        >
          <p class="text-red-700 text-sm font-medium flex items-center">
            <span class="mr-2">⚠️</span>
            {{ errorMessage }}
          </p>
        </div>

        <!-- Login Button -->
        <button
          type="submit"
          class="w-full bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-700 hover:to-purple-700 text-white font-bold py-3 px-4 rounded-lg transition-all duration-200 transform hover:scale-105 active:scale-95 shadow-lg mt-6"
        >
          Sign In
        </button>
      </form>

      <!-- Divider -->
      <div class="flex items-center my-6">
        <div class="flex-grow border-t border-gray-300"></div>
        <span class="px-3 text-gray-500 text-sm">New here?</span>
        <div class="flex-grow border-t border-gray-300"></div>
      </div>

      <!-- Sign Up Link -->
      <p class="text-center text-gray-700">
        <span class="text-gray-600">Don't have an account? </span>
        <a
          routerLink="/signup"
          class="font-semibold text-indigo-600 hover:text-indigo-700 transition-colors duration-200"
        >
          Sign Up
        </a>
      </p>
    </div>

    <!-- Footer -->
    <div class="text-center mt-8">
      <p class="text-white text-opacity-80 text-xs">
        © 2026 Bug Tracker. All rights reserved.
      </p>
    </div>
  </div>
</div>
