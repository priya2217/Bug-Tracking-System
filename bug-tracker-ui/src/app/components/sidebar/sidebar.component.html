<div class="h-full bg-white border-r border-slate-200 flex flex-col shadow-sm">
  <!-- Logo/Brand -->
  <div class="p-6 border-b border-slate-200">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center shadow-md">
        <span class="text-2xl">🐛</span>
      </div>
      <div *ngIf="!collapsed">
        <div class="font-bold text-lg text-slate-900">Bug Tracker</div>
        <div class="text-xs text-slate-500"></div>
      </div>
    </div>
  </div>

  <!-- Navigation -->
  <nav class="flex-1 p-4 space-y-1 overflow-y-auto">
    <!-- Dashboard -->
    <a
      routerLink="/dashboard"
      routerLinkActive="active"
      class="nav-link group flex items-center gap-3 px-4 py-3 rounded-lg text-slate-700 hover:bg-slate-100 hover:text-slate-900 transition-all duration-200"
      [ngClass]="{ 'bg-blue-50 text-blue-600 hover:bg-blue-100 hover:text-blue-700': isActive('/dashboard') }"
    >
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
      </svg>
      <span *ngIf="!collapsed" class="font-medium">Dashboard</span>
    </a>

    <!-- Bugs Section Header -->
    <div *ngIf="!collapsed" class="px-4 pt-4 pb-2">
      <span class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Bug Management</span>
    </div>

    <!-- Bugs List -->
    <a
      routerLink="/bugs"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      class="nav-link group flex items-center gap-3 px-4 py-3 rounded-lg text-slate-700 hover:bg-slate-100 hover:text-slate-900 transition-all duration-200"
      [ngClass]="{ 'bg-blue-50 text-blue-600 hover:bg-blue-100 hover:text-blue-700': isActive('/bugs') && !isActive('/bugs/board') }"
    >
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
      </svg>
      <span *ngIf="!collapsed" class="font-medium">List View</span>
      <span *ngIf="!collapsed && bugCount > 0" class="ml-auto bg-red-100 text-red-700 text-xs font-semibold px-2 py-1 rounded-full">
        {{ bugCount }}
      </span>
    </a>

    <!-- Board View (NEW) -->
    <a
      routerLink="/board"
      routerLinkActive="active"
      class="nav-link group flex items-center gap-3 px-4 py-3 rounded-lg text-slate-700 hover:bg-slate-100 hover:text-slate-900 transition-all duration-200"
      [ngClass]="{ 'bg-blue-50 text-blue-600 hover:bg-blue-100 hover:text-blue-700': isActive('/bugs/board') }"
    >
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17V7m0 10a2 2 0 01-2 2H5a2 2 0 01-2-2V7a2 2 0 012-2h2a2 2 0 012 2m0 10a2 2 0 002 2h2a2 2 0 002-2M9 7a2 2 0 012-2h2a2 2 0 012 2m0 10V7m0 10a2 2 0 002 2h2a2 2 0 002-2V7a2 2 0 00-2-2h-2a2 2 0 00-2 2" />
      </svg>
      <span *ngIf="!collapsed" class="font-medium">Board View</span>
      
    </a>

    <!-- Divider -->
    <div *ngIf="!collapsed" class="border-t border-slate-200 my-4"></div>

    <!-- Projects -->
    <a
      routerLink="/projects"
      routerLinkActive="active"
      class="nav-link group flex items-center gap-3 px-4 py-3 rounded-lg text-slate-700 hover:bg-slate-100 hover:text-slate-900 transition-all duration-200"
      [ngClass]="{ 'bg-blue-50 text-blue-600 hover:bg-blue-100 hover:text-blue-700': isActive('/projects') }"
    >
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z" />
      </svg>
      <span *ngIf="!collapsed" class="font-medium">Projects</span>
    </a>

    <!-- Reports (Coming Soon) -->
    <a
      routerLink="/reports"
      class="nav-link group flex items-center gap-3 px-4 py-3 rounded-lg text-slate-400 cursor-not-allowed transition-all duration-200"
      [attr.disabled]="true"
      title="Coming soon"
    >
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
      </svg>
      <span *ngIf="!collapsed" class="font-medium">Reports</span>
      <span *ngIf="!collapsed" class="ml-auto text-xs text-slate-400">Soon</span>
    </a>

    <!-- Settings Section -->
    <div *ngIf="!collapsed" class="px-4 pt-4 pb-2">
      <span class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Settings</span>
    </div>

    <!-- Profile -->
    <a
      routerLink="/profile"
      routerLinkActive="active"
      class="nav-link group flex items-center gap-3 px-4 py-3 rounded-lg text-slate-700 hover:bg-slate-100 hover:text-slate-900 transition-all duration-200"
      [ngClass]="{ 'bg-blue-50 text-blue-600 hover:bg-blue-100 hover:text-blue-700': isActive('/profile') }"
    >
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
      </svg>
      <span *ngIf="!collapsed" class="font-medium">Profile</span>
    </a>
  </nav>

  <!-- User Info & Logout -->
  <div class="p-4 border-t border-slate-200 space-y-2">
    <!-- User Info -->
    <div *ngIf="!collapsed" class="px-4 py-3 bg-slate-50 rounded-lg">
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center text-white font-bold text-sm">
          {{ getUserInitial() }}
        </div>
        <div class="flex-1 min-w-0">
          <div class="text-sm font-semibold text-slate-900 truncate">{{ getUsername() }}</div>
          <div class="text-xs text-slate-500"></div>
        </div>
      </div>
    </div>

    <!-- Logout Button -->
    <button
      (click)="logout()"
      class="w-full flex items-center gap-3 px-4 py-3 rounded-lg text-red-600 hover:bg-red-50 transition-all duration-200"
    >
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
      </svg>
      <span *ngIf="!collapsed" class="font-medium">Logout</span>
    </button>

    <!-- Toggle Button -->
    <button
      (click)="onToggle()"
      class="w-full flex items-center justify-center gap-2 px-4 py-2 text-sm text-slate-600 hover:text-slate-900 hover:bg-slate-100 rounded-lg transition-all duration-200"
    >
      <svg *ngIf="!collapsed" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 19l-7-7 7-7m8 14l-7-7 7-7" />
      </svg>
      <svg *ngIf="collapsed" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 5l7 7-7 7M5 5l7 7-7 7" />
      </svg>
      <span *ngIf="!collapsed" class="text-xs">Collapse</span>
    </button>
  </div>
</div>
