<div class="max-w-3xl mx-auto p-6 bg-white rounded-xl shadow">
  <h2 class="text-2xl font-bold mb-4">Projects</h2>

  <div class="mb-4">
    <label class="block text-sm font-semibold text-gray-700 mb-2"
      >New Project</label
    >
    <div class="flex gap-2">
      <input
        [(ngModel)]="newName"
        placeholder="Project name"
        class="flex-1 px-3 py-2 border rounded"
      />
      <button
        (click)="createProject()"
        [disabled]="creating"
        class="bg-indigo-600 text-white px-4 py-2 rounded"
      >
        {{ creating ? "Creating..." : "Create" }}
      </button>
    </div>
  </div>

  <div *ngIf="projects.length === 0" class="text-gray-600">
    No projects found. Create a local project to get started.
  </div>

  <ul *ngIf="projects.length > 0" class="space-y-3">
    <li
      *ngFor="let p of projects"
      class="flex items-center justify-between p-3 border rounded"
    >
      <div>
        <div class="font-semibold">{{ p.name }}</div>
        <div class="text-sm text-gray-500">ID: {{ p.projectId }}</div>
      </div>
      <div class="flex items-center gap-2">
        <a
          [routerLink]="['/bugs']"
          [queryParams]="{ projectId: p.projectId }"
          class="text-indigo-600 underline"
          >View Bugs</a
        >
        <button (click)="deleteProject(p.projectId)" class="text-red-600">
          Delete
        </button>
      </div>
    </li>
  </ul>
</div>
